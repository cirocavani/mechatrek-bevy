name: Build Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  docker-devel:
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            dockerfile: docker/ubuntu/Dockerfile
            image_name: ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-ubuntu
            platform: linux/amd64
          - os: ubuntu-26.04-arm
            dockerfile: docker/debian/Dockerfile
            image_name: ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-debian
            platform: linux/arm64

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Capture Host User and Group IDs
        run: |
          echo "HOST_UID=$(id -u)" >> $GITHUB_ENV
          echo "HOST_GID=$(id -g)" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build and push
        uses: docker/build-push-action@v7
        id: docker-build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            USER_ID=${{ env.HOST_UID }}
            GROUP_ID=${{ env.HOST_GID }}
          tags: ${{ matrix.image_name }}:latest
          push: true

      - name: Docker artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.image_name }}
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true
