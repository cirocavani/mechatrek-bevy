name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
            build_image: ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-ubuntu:latest
          - os: ubuntu-26.04-arm
            arch: aarch64
            build_image: ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-debian:latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo Build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ci-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-${{ matrix.arch }}-

      - name: Build Linux Binary
        run: |
          docker pull ${{ matrix.build_image }}

          mkdir -p "$HOME/.cargo/registry"
          mkdir -p "$HOME/.cargo/git"

          docker run --rm \
            -v "${{ github.workspace }}":/home/mechatrek/project \
            -v "$HOME/.cargo/registry":/home/mechatrek/.cargo/registry \
            -v "$HOME/.cargo/git":/home/mechatrek/.cargo/git \
            ${{ matrix.build_image }} \
            make build

  build-wasm:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo Build (WASM)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ci-wasm32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-wasm32-

      - name: Build WASM Binary
        run: |
          docker pull ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-ubuntu:latest

          mkdir -p "$HOME/.cargo/registry"
          mkdir -p "$HOME/.cargo/git"

          docker run --rm \
            -v "${{ github.workspace }}":/home/mechatrek/project \
            -v "$HOME/.cargo/registry":/home/mechatrek/.cargo/registry \
            -v "$HOME/.cargo/git":/home/mechatrek/.cargo/git \
            ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-ubuntu:latest \
            make build-web

  build-android:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true

      - name: Cache Cargo Build (Android)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            ~/.gradle/caches/
          key: cargo-ci-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-android-

      - name: Cache Gradle Build (Android)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/
          key: gradle-ci-android-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            gradle-ci-android-

      - name: Build Android Package
        run: |
          docker pull ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-ubuntu:latest

          mkdir -p "$HOME/.cargo/registry"
          mkdir -p "$HOME/.cargo/git"
          mkdir -p "$HOME/.cargo/caches"

          docker run --rm \
            -v "${{ github.workspace }}":/home/mechatrek/project \
            -v "$HOME/.cargo/registry":/home/mechatrek/.cargo/registry \
            -v "$HOME/.cargo/git":/home/mechatrek/.cargo/git \
            -v "$HOME/.gradle/caches":/home/mechatrek/.gradle/caches \
            ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-ubuntu:latest \
            make build-android-lib build-android-apk
