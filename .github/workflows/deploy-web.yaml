name: Deploy Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo Build (WASM)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-wasm32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-wasm32-

      - name: Build WASM Binary
        run: |
          docker pull ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-ubuntu:latest

          mkdir -p "$HOME/.cargo/registry"
          mkdir -p "$HOME/.cargo/git"

          docker run --rm \
            -v "${{ github.workspace }}":/home/mechatrek/project \
            -v "$HOME/.cargo/registry":/home/mechatrek/.cargo/registry \
            -v "$HOME/.cargo/git":/home/mechatrek/.cargo/git \
            ghcr.io/cirocavani/mechatrek-bevy/mechatrek-bevy-ubuntu:latest \
            make build-web

          rm -rf dist/mechatrek-bevy-web
          mkdir -p dist/mechatrek-bevy-web
          cp -r web/* dist/mechatrek-bevy-web/
          rm dist/mechatrek-bevy-web/assets
          cp -r assets dist/mechatrek-bevy-web/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/mechatrek-bevy-web

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
