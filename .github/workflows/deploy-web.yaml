name: Deploy GHP

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-web:
    runs-on: ubuntu-26.04

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: true

      - name: Install Rust Target & wasm-bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126

      - name: Cache Cargo Build (WASM)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-wasm32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-wasm32-

      - name: Build WASM Binary
        run: |
          cargo build \
            --profile wasm-release \
            --target wasm32-unknown-unknown \
            --features log-max

      - name: Bindgen & Package WASM
        run: |
          rm -rf dist/mechatrek-bevy-web/
          mkdir -p dist/mechatrek-bevy-web/

          cp web/index.html dist/mechatrek-bevy-web/
          cp -r assets dist/mechatrek-bevy-web/

          wasm-bindgen \
            --out-name mechatrek_bevy \
            --out-dir dist/mechatrek-bevy-web/ \
            --target web \
            target/wasm32-unknown-unknown/wasm-release/mechatrek-bevy.wasm

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/mechatrek-bevy-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
